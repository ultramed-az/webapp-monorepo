services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      BACKEND_PORT: "${BACKEND_PORT}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN}"
      CDN_BASE_URL: "${CDN_BASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_SESSION_TTL_HOURS: "${ADMIN_SESSION_TTL_HOURS}"
      ADMIN_LOGIN_MAX_ATTEMPTS: "${ADMIN_LOGIN_MAX_ATTEMPTS}"
      ADMIN_LOGIN_LOCK_WINDOW_MINUTES: "${ADMIN_LOGIN_LOCK_WINDOW_MINUTES}"
      ADMIN_SEED_EMAIL: "${ADMIN_SEED_EMAIL}"
      ADMIN_SEED_PASSWORD: "${ADMIN_SEED_PASSWORD}"
      NODE_ENV: "${NODE_ENV}"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: sh -lc "pnpm db:generate && pnpm --filter @ultramed/api dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        FRONTEND_PORT: ${FRONTEND_PORT}
        BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:${BACKEND_PORT}"
      API_INTERNAL_URL: "http://api:${BACKEND_PORT}"
      FRONTEND_PORT: "${FRONTEND_PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm --filter @ultramed/web dev

volumes:
  mysql_data_dev:
