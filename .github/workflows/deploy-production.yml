name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "Missing required secrets: VPS_HOST, VPS_SSH_KEY"
            exit 1
          fi

          PORT="${VPS_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_USER:-}" ]; then
            echo "Missing required secret: VPS_USER"
            exit 1
          fi

          PORT="${VPS_PORT:-22}"
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/ultramed.az}"

          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          docker compose --env-file .env.production -f docker-compose.build.yml up -d --build api web

          docker compose --env-file .env.production -f docker-compose.build.yml run --rm api \
            sh -lc 'packages/database/node_modules/.bin/prisma db push --schema=packages/database/prisma/schema.prisma'

          curl -fsS http://127.0.0.1:5555/health > /dev/null
          curl -fsS http://127.0.0.1:3333/health > /dev/null
          EOF
