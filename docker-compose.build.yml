services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - mysql_data_prod:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      BACKEND_PORT: "${BACKEND_PORT}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN}"
      CDN_BASE_URL: "${CDN_BASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_SESSION_TTL_HOURS: "${ADMIN_SESSION_TTL_HOURS}"
      ADMIN_LOGIN_MAX_ATTEMPTS: "${ADMIN_LOGIN_MAX_ATTEMPTS}"
      ADMIN_LOGIN_LOCK_WINDOW_MINUTES: "${ADMIN_LOGIN_LOCK_WINDOW_MINUTES}"
      ADMIN_SEED_EMAIL: "${ADMIN_SEED_EMAIL}"
      ADMIN_SEED_PASSWORD: "${ADMIN_SEED_PASSWORD}"
      NODE_ENV: "${NODE_ENV}"
      TRUST_PROXY: "${TRUST_PROXY}"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        FRONTEND_PORT: ${FRONTEND_PORT}
        BACKEND_PORT: ${BACKEND_PORT}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      API_INTERNAL_URL: "${API_INTERNAL_URL}"
      FRONTEND_PORT: "${FRONTEND_PORT}"
    depends_on:
      - api
    restart: always

volumes:
  mysql_data_prod:
  api_uploads:
