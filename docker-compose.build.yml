services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ultramed
    volumes:
      - mysql_data_prod:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "mysql://root:password@db:3306/ultramed"
    depends_on:
      - db
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "https://api.ultramed.az" # Change to actual domain
    restart: always

volumes:
  mysql_data_prod:
